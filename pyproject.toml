[project]
name = "xshared"
version = "0.1.0"
description = "Shared models and migrations for Xwick services"
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "dadata>=21.0",
]

[project.scripts]
xshared = "xshared.cli.main:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xshared = ["py.typed"]
